<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ชำระเงินค่าบริการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- เพิ่ม LINE LIFF SDK (เตรียมพร้อมสำหรับการเป็น LIFF App ของแท้) -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8fafc; /* พื้นหลังสีเทาอ่อนแบบแอปพรีเมียม */
            -webkit-tap-highlight-color: transparent;
        }

        /* ซ่อน File Input */
        input[type="file"] {
            display: none;
        }

        /* การ์ดแบบนุ่มนวล (Soft UI) */
        .card-selectable {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .card-selectable:active {
            transform: scale(0.97);
        }

        /* เมื่อการ์ดถูกเลือก */
        .card-selected {
            border-color: #0f172a !important; /* สีดำเข้ม */
            background-color: #f1f5f9 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* พื้นที่อัปโหลดสลิป */
        .dropzone {
            transition: all 0.3s ease;
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23CBD5E1' stroke-width='4' stroke-dasharray='10%2c 10' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 16px;
        }
        .dropzone:active {
            background-color: #f8fafc;
        }
        .dropzone.has-file {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='%23F0FDF4' rx='16' ry='16' stroke='%2322C55E' stroke-width='4' stroke-dasharray='10%2c 10' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }

        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="pb-28 text-slate-800">

    <!-- Header สุดเท่ -->
    <div class="bg-slate-900 text-white rounded-b-3xl pt-10 pb-8 px-6 shadow-lg mb-8 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">ชำระเงิน</h1>
                <p class="text-slate-300 text-sm mt-1" id="profile-name">ยินดีต้อนรับสู่ร้านของเรา</p>
            </div>
            <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-sm">
                <span class="text-2xl">✂️</span>
            </div>
        </div>
    </div>

    <div class="max-w-lg mx-auto px-5 space-y-8">
        
        <!-- ส่วนที่ 1: เลือกช่าง -->
        <div class="animate-fade-in-up">
            <div class="flex items-center mb-3">
                <span class="bg-slate-900 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-2">1</span>
                <h2 class="text-lg font-bold">เลือกช่างที่ให้บริการคุณ</h2>
            </div>
            <div id="barber-container" class="grid grid-cols-2 gap-4">
                <!-- Skeleton Loading -->
                <div class="animate-pulse bg-slate-200 h-24 rounded-2xl col-span-1"></div>
                <div class="animate-pulse bg-slate-200 h-24 rounded-2xl col-span-1"></div>
            </div>
            <input type="hidden" id="barber_id" required>
        </div>

        <!-- ส่วนที่ 2: เลือกบริการ -->
        <div class="animate-fade-in-up" style="animation-delay: 0.1s;">
            <div class="flex items-center mb-3">
                <span class="bg-slate-900 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-2">2</span>
                <h2 class="text-lg font-bold">เลือกบริการที่ทำ</h2>
            </div>
            <div id="service-container" class="flex flex-col gap-3">
                <!-- Skeleton Loading -->
                <div class="animate-pulse bg-slate-200 h-16 rounded-2xl"></div>
                <div class="animate-pulse bg-slate-200 h-16 rounded-2xl"></div>
            </div>
            <input type="hidden" id="service_id" required>
        </div>

        <!-- ส่วนที่ 3: อัปโหลดสลิป -->
        <div class="animate-fade-in-up" style="animation-delay: 0.2s;">
            <div class="flex items-center mb-3">
                <span class="bg-slate-900 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-2">3</span>
                <h2 class="text-lg font-bold">แนบสลิปโอนเงิน</h2>
            </div>
            <label for="slip_file" id="dropzone-area" class="dropzone flex flex-col items-center justify-center w-full h-40 cursor-pointer">
                <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                    <svg id="upload-icon" class="w-12 h-12 mb-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <p class="mb-1 text-sm font-semibold text-slate-700" id="file-name-display">แตะที่นี่เพื่อเลือกรูปสลิปจากมือถือ</p>
                    <p class="text-xs text-slate-400" id="file-hint">ระบบจะตรวจสอบสลิปอัตโนมัติ</p>
                </div>
                <input id="slip_file" type="file" accept="image/*" required />
            </label>
        </div>

    </div>

    <!-- ปุ่มยืนยัน (Sticky Bottom - ติดขอบจอล่างตลอดเวลา ทำให้กดง่าย) -->
    <div class="fixed bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-white via-white to-transparent">
        <button onclick="submitPayment()" class="w-full max-w-lg mx-auto block bg-slate-900 text-white text-lg font-bold py-4 px-4 rounded-2xl shadow-xl hover:bg-slate-800 active:scale-95 transition-all duration-200">
            ยืนยันการชำระเงิน
        </button>
    </div>

    <script>
        // ==========================================
        // 🔗 การตั้งค่าระบบ
        // ==========================================
        
        // [1] ใส่ LIFF ID ของคุณตรงนี้ (เอามาจาก LINE Developers)
        // ถ้ายังไม่มี ปล่อยว่างไว้ก่อนได้ครับ หน้าเว็บก็ยังทำงานได้
        const MY_LIFF_ID = ""; 

        // [2] ลิงก์ Webhook (ดึงข้อมูลอัตโนมัติจาก n8n)
        const MAIN_WEBHOOK_URL = "https://primary-production-f7fa8.up.railway.app/webhook/barber-api";
        const GET_BARBERS_URL = "https://primary-production-f7fa8.up.railway.app/webhook/get-barbers";
        const GET_SERVICES_URL = "https://primary-production-f7fa8.up.railway.app/webhook/get-services";

        // ==========================================
        // ระบบ LIFF Initialization (ดึงชื่อลูกค้าจาก LINE)
        // ==========================================
        async function initializeLiff() {
            if (!MY_LIFF_ID) return; // ถ้ายังไม่ใส่ LIFF ID ให้ข้ามไป
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('profile-name').innerText = `สวัสดีคุณ ${profile.displayName} 👋`;
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Init Error:", err);
            }
        }

        // ==========================================
        // UI Interaction (HCI Design)
        // ==========================================
        
        // แสดงชื่อไฟล์และเปลี่ยนสีกรอบเมื่อเลือกรูป
        document.getElementById('slip_file').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name;
            const dropzone = document.getElementById('dropzone-area');
            const icon = document.getElementById('upload-icon');
            
            if (fileName) {
                document.getElementById('file-name-display').innerHTML = `<span class="text-green-600 font-bold text-base">✓ เลือกไฟล์สำเร็จ</span>`;
                document.getElementById('file-hint').innerText = fileName;
                dropzone.classList.add('has-file');
                // เปลี่ยนไอคอนเป็นเครื่องหมายถูก
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
                icon.classList.replace('text-slate-400', 'text-green-500');
            }
        });

        // ระบบคลิกเลือกการ์ดช่าง
        function selectBarber(id, cardElement) {
            document.getElementById('barber_id').value = id;
            document.querySelectorAll('.barber-card').forEach(el => el.classList.remove('card-selected'));
            cardElement.classList.add('card-selected');
        }

        // ระบบคลิกเลือกการ์ดบริการ
        function selectService(id, cardElement) {
            document.getElementById('service_id').value = id;
            document.querySelectorAll('.service-card').forEach(el => el.classList.remove('card-selected'));
            cardElement.classList.add('card-selected');
        }

        // ==========================================
        // ดึงข้อมูลจาก Database (API Fetch)
        // ==========================================
        async function loadDataFromDatabase() {
            try {
                // ดึงรายชื่อช่าง
                const barberRes = await fetch(GET_BARBERS_URL);
                const barbers = await barberRes.json();
                let barberHTML = '';
                barbers.forEach(b => {
                    barberHTML += `
                        <div onclick="selectBarber('${b.user_id}', this)" class="barber-card card-selectable rounded-2xl p-4 text-center flex flex-col items-center justify-center min-h-[6rem]">
                            <div class="text-3xl mb-1">👨‍🎤</div>
                            <div class="font-bold text-slate-800 text-sm">${b.full_name}</div>
                        </div>
                    `;
                });
                document.getElementById('barber-container').innerHTML = barberHTML;

                // ดึงบริการและราคา
                const serviceRes = await fetch(GET_SERVICES_URL);
                const services = await serviceRes.json();
                let serviceHTML = '';
                services.forEach(s => {
                    serviceHTML += `
                        <div onclick="selectService(${s.service_id}, this)" class="service-card card-selectable rounded-2xl p-4 flex justify-between items-center">
                            <div class="flex items-center">
                                <div class="bg-slate-100 p-2 rounded-lg mr-3 text-lg">✂️</div>
                                <span class="font-bold text-slate-800">${s.service_name}</span>
                            </div>
                            <span class="bg-slate-900 text-white text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm">${s.base_price} ฿</span>
                        </div>
                    `;
                });
                document.getElementById('service-container').innerHTML = serviceHTML;

            } catch (error) {
                console.error("Error loading API:", error);
                document.getElementById('barber-container').innerHTML = '<p class="text-red-500 text-sm font-bold text-center col-span-2">⚠️ ขัดข้อง: ไม่สามารถดึงข้อมูลช่างได้</p>';
                document.getElementById('service-container').innerHTML = '<p class="text-red-500 text-sm font-bold text-center">⚠️ ขัดข้อง: ไม่สามารถดึงข้อมูลบริการได้</p>';
            }
        }

        // ==========================================
        // ส่งข้อมูลชำระเงิน (Submit)
        // ==========================================
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function submitPayment() {
            const barber_id = document.getElementById("barber_id").value;
            const service_id = document.getElementById("service_id").value;
            const fileInput = document.getElementById("slip_file");
            
            if (!barber_id || !service_id || fileInput.files.length === 0) {
                Swal.fire({ 
                    icon: 'warning', 
                    title: 'ข้อมูลไม่ครบ', 
                    text: 'กรุณาแตะเลือกช่าง, บริการ, และแนบสลิปครับ', 
                    confirmButtonColor: '#0f172a',
                    shape: 'rounded-2xl'
                });
                return;
            }

            Swal.fire({ 
                title: 'กำลังตรวจสอบสลิป...', 
                html: 'ระบบกำลังติดต่อไปที่ธนาคาร กรุณารอสักครู่',
                allowOutsideClick: false, 
                didOpen: () => { Swal.showLoading(); } 
            });

            try {
                const base64Image = await getBase64(fileInput.files[0]);
                const payload = {
                    intent: "record_bill",
                    user_id: barber_id,
                    service_id: parseInt(service_id),
                    imageBase64: base64Image
                };

                let response = await fetch(MAIN_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if(response.ok) {
                    Swal.fire({ 
                        icon: 'success', 
                        title: 'ชำระเงินสำเร็จ!', 
                        text: 'ข้อมูลถูกส่งเข้า Database และแจ้งเตือนช่างเรียบร้อยครับ', 
                        confirmButtonColor: '#0f172a' 
                    }).then(() => {
                        // รีเซ็ตหน้าเว็บ หรือปิดหน้าต่าง LIFF
                        if (MY_LIFF_ID && liff.isInClient()) {
                            liff.closeWindow();
                        } else {
                            window.location.reload();
                        }
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถบันทึกข้อมูลได้', confirmButtonColor: '#0f172a' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'การเชื่อมต่อล้มเหลว', text: 'กรุณาลองใหม่อีกครั้ง', confirmButtonColor: '#0f172a' });
            }
        }

        // เริ่มต้นการทำงานเมื่อหน้าเว็บโหลดเสร็จ
        window.onload = () => {
            initializeLiff();
            loadDataFromDatabase();
        };
    </script>
</body>
</html>
